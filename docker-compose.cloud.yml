# AgentX 私有化部署（云端 LLM 模式）
# 不依赖本地 Ollama，使用 DeepSeek API
#
# 使用方式:
#   1. 复制 .env.example 为 .env，设置 LLM_PROVIDER=deepseek 和 DEEPSEEK_API_KEY
#   2. docker compose -f docker-compose.cloud.yml up -d

services:
  agentx:
    build: .
    container_name: agentx
    ports:
      - "${AGENTX_PORT:-8001}:8001"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - agentx_data:/app/data
      - agentx_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: agentx-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agentx
    restart: unless-stopped

volumes:
  agentx_data:
  agentx_logs:
