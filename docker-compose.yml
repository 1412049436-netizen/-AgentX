# AgentX 私有化部署
# docker compose up -d
#
# 首次使用 Ollama 需拉取模型:
#   docker compose exec ollama ollama pull qwen2.5:7b
#
# 如不使用本地 Ollama，改用云端 API:
#   1. 注释掉 ollama 服务
#   2. 修改 .env: LLM_PROVIDER=deepseek, 填入 DEEPSEEK_API_KEY

services:
  agentx:
    build: .
    container_name: agentx
    ports:
      - "${AGENTX_PORT:-8001}:8001"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - agentx_data:/app/data
      - agentx_logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nginx:
    image: nginx:alpine
    container_name: agentx-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agentx
    restart: unless-stopped

volumes:
  agentx_data:
  agentx_logs:
  ollama_models:
